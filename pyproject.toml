[project]
name = "scc-sdk-workflows"
version = "0.1.0"
description = "Runnable Cisco Security Cloud Control SDK workflow examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cisco-scc-sdk",
    "mcp",
    "openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
