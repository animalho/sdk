[project]
name = "scc-sdk-workflows"
version = "0.1.0"
description = "Runnable Cisco Security Cloud Control SDK workflow examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cisco-scc-sdk",
    "mcp",
    "openai",
]

[project.scripts]
scc-list-orgs = "scc_sdk_workflows.list_orgs:main"
scc-read-claim-code = "scc_sdk_workflows.read_claim_code:main"
scc-run-workflow = "scc_sdk_workflows.run_workflow:main"
scc-mcp-agent = "scc_sdk_workflows.mcp_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
